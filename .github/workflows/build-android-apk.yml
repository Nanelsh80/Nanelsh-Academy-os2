name: Build NANELSH Final Master APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NANELSH-Academy-OS-Manus-2.2-Final-Master.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Final Master
        run: |
          rm -rf source
          mkdir -p source
          unzip -q NANELSH-Academy-OS-Manus-2.2-Final-Master.zip -d source
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'NANELSH-Academy-OS-Manus-2.2-Final-Master.zip' \
            ! -name 'source' \
            -exec rm -rf {} +
          cp -a source/. .
          rm -rf source

      - name: Verify Expo project
        run: |
          test -f package.json
          test -f App.tsx
          test -f eas.json
          test -d android
          node -e "const p=require('./package.json'); console.log('name=',p.name); console.log('version=',p.version);"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: TypeScript diagnostics
        continue-on-error: true
        run: npm run typecheck

      - name: Build Android Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NANELSH-Academy-OS-Final-Master-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
