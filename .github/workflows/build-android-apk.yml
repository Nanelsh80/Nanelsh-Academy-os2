name: Build NANELSH Final Master APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NANELSH-Academy-OS-Manus-2.2-Final-Master.zip'
      - 'scripts/apply_final_visual_skin.py'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preserve visual skin script
        run: cp scripts/apply_final_visual_skin.py /tmp/apply_final_visual_skin.py

      - name: Extract Final Master
        run: |
          rm -rf source
          mkdir -p source
          unzip -q NANELSH-Academy-OS-Manus-2.2-Final-Master.zip -d source
          find . -mindepth 1 -maxdepth 1             ! -name '.git'             ! -name '.github'             ! -name 'NANELSH-Academy-OS-Manus-2.2-Final-Master.zip'             ! -name 'source'             -exec rm -rf {} +
          cp -a source/. .
          rm -rf source
          mkdir -p scripts
          cp /tmp/apply_final_visual_skin.py scripts/apply_final_visual_skin.py

      - name: Apply final NANELSH visual skin
        run: python3 scripts/apply_final_visual_skin.py

      - name: Finalize launcher icon metadata
        run: |
          test -f assets/nanelsh-logo.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import json
          source = Path('assets/nanelsh-logo.png')
          assert source.exists(), 'Approved full NANELSH logo is missing'
          logo = Image.open(source).convert('RGBA')
          canvas_size = 1024
          cream = (244, 235, 221, 255)
          # Standard icon: retain the complete framed logo with a little breathing room.
          icon = Image.new('RGBA', (canvas_size, canvas_size), cream)
          regular = logo.resize((920, 920), Image.Resampling.LANCZOS)
          icon.alpha_composite(regular, ((canvas_size-920)//2, (canvas_size-920)//2))
          icon.save('assets/icon.png')
          icon.save('assets/nanelsh-app-icon.png')
          Image.new('RGBA', (canvas_size, canvas_size), cream).save('assets/android-icon-background.png')
          # Adaptive foreground: keep the entire rounded logo tile inside Android's safe circle.
          foreground = Image.new('RGBA', (canvas_size, canvas_size), (0, 0, 0, 0))
          safe_logo = logo.resize((700, 700), Image.Resampling.LANCZOS)
          foreground.alpha_composite(safe_logo, ((canvas_size-700)//2, (canvas_size-700)//2))
          foreground.save('assets/android-icon-foreground.png')
          # Android themed icon: derive a transparent white silhouette from the complete logo.
          background = Image.new('RGB', logo.size, logo.getpixel((0, 0))[:3])
          difference = ImageChops.difference(logo.convert('RGB'), background).convert('L')
          alpha = difference.point(lambda value: 0 if value < 18 else min(255, (value - 18) * 4))
          mono = Image.new('RGBA', logo.size, (255, 255, 255, 0))
          mono.putalpha(alpha)
          mono = mono.resize((canvas_size, canvas_size), Image.Resampling.LANCZOS)
          mono.save('assets/android-icon-monochrome.png')
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in sizes.items():
              folder = Path('android/app/src/main/res') / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon.resize((size, size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher.webp', 'WEBP', quality=100, lossless=True)
              icon.resize((size, size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher_round.webp', 'WEBP', quality=100, lossless=True)
              foreground.resize((size, size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher_foreground.webp', 'WEBP', quality=100, lossless=True)
              Image.new('RGBA', (size, size), cream).save(folder / 'ic_launcher_background.webp', 'WEBP', quality=100, lossless=True)
              mono.resize((size, size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher_monochrome.webp', 'WEBP', quality=100, lossless=True)
          p = Path('app.json')
          d = json.loads(p.read_text())
          d['expo']['icon'] = './assets/icon.png'
          d['expo']['android']['adaptiveIcon']['foregroundImage'] = './assets/android-icon-foreground.png'
          d['expo']['android']['adaptiveIcon']['backgroundImage'] = './assets/android-icon-background.png'
          d['expo']['android']['adaptiveIcon']['monochromeImage'] = './assets/android-icon-monochrome.png'
          d['expo']['version'] = '2.3.4'
          d['expo']['android']['versionCode'] = 11
          d['expo']['android']['adaptiveIcon']['backgroundColor'] = '#F4EBDD'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2))
          print('Generated launcher icons from full NANELSH logo with Android-safe padding')
          PY

      - name: Fix bottom navigation safe area
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("App.tsx")
          s = p.read_text()
          s = s.replace(
              'import { SafeAreaProvider, SafeAreaView } from "react-native-safe-area-context";',
              'import { SafeAreaProvider, SafeAreaView, useSafeAreaInsets } from "react-native-safe-area-context";'
          )
          s = s.replace(
              'function MainApp() {\n',
              'function MainApp() {\n  const insets = useSafeAreaInsets();\n',
              1
          )
          s = s.replace(
              '<View style={styles.tabBar}>',
              '<View style={[styles.tabBar, { paddingBottom: Math.max(12, insets.bottom + 8), minHeight: 92 + insets.bottom }]}>'
          )
          s = s.replace(
              'tabBar: { flexDirection: "row-reverse", minHeight: 78, paddingHorizontal: 4, paddingTop: 7, paddingBottom: 8, backgroundColor: "#FBF6ED", borderTopWidth: 1, borderTopColor: COLORS.border, justifyContent: "space-around", shadowColor: "#6B6257", shadowOpacity: 0.08, shadowOffset: { width: 0, height: -4 }, shadowRadius: 10, elevation: 8 },',
              'tabBar: { flexDirection: "row-reverse", minHeight: 92, paddingHorizontal: 4, paddingTop: 5, paddingBottom: 12, backgroundColor: "#FBF6ED", borderTopWidth: 1, borderTopColor: COLORS.border, justifyContent: "space-around", shadowColor: "#6B6257", shadowOpacity: 0.08, shadowOffset: { width: 0, height: -4 }, shadowRadius: 10, elevation: 8 },'
          )
          s = s.replace(
              'tabItem: { alignItems: "center", justifyContent: "center", flex: 1, minWidth: 40, gap: 3 },',
              'tabItem: { alignItems: "center", justifyContent: "flex-start", flex: 1, minWidth: 40, paddingTop: 1, gap: 4 },'
          )
          s = s.replace(
              'tabText: { color: COLORS.muted, fontSize: 8, fontWeight: "700" }, tabTextSelected: { color: COLORS.primaryDeep },',
              'tabText: { color: COLORS.muted, fontSize: 9, fontWeight: "700", lineHeight: 13, textAlign: "center" }, tabTextSelected: { color: COLORS.primaryDeep, fontWeight: "900" },'
          )
          p.write_text(s)
          PY

      - name: Fix student save binding
        run: |
          python3 -c "from pathlib import Path; p=Path('src/data/store.ts'); s=p.read_text(); old='    input.totalSessions ?? 0,\\n    input.completedSessions ?? 0,\\n    input.remainingSessions ?? input.totalSessions ?? 0,\\n    input.lastNotes?.trim() || null,\\n    createdAt()\\n'; new='    input.totalSessions ?? 0,\\n    input.completedSessions ?? 0,\\n    input.remainingSessions ?? input.totalSessions ?? 0,\\n    input.lastNotes?.trim() || null,\\n    1,\\n    createdAt()\\n'; assert old in s, 'Expected createStudent binding block not found'; p.write_text(s.replace(old,new,1))"

      - name: Fix group creation save binding
        run: |
          python3 -c "from pathlib import Path; p=Path('src/data/store.ts'); s=p.read_text(); old='    input.totalSessions ?? 0,\\n    input.remainingSessions ?? input.totalSessions ?? 0,\\n    input.notes?.trim() || null,\\n    createdAt()\\n'; new='    input.totalSessions ?? 0,\\n    0,\\n    input.remainingSessions ?? input.totalSessions ?? 0,\\n    input.notes?.trim() || null,\\n    createdAt()\\n'; assert old in s, 'Expected createGroup binding block not found'; p.write_text(s.replace(old,new,1))"

      - name: Fix dashboard hero button and make navigation scrollable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('App.tsx')
          s = p.read_text()
          # Change the hero action by its visible Arabic label, regardless of prop order.
          hero_start = s.find('<View style={styles.heroActions}>')
          if hero_start < 0:
              raise SystemExit('Hero actions section not found')
          hero_end = s.find('</View>', hero_start)
          if hero_end < 0:
              raise SystemExit('Hero actions section is incomplete')
          hero = s[hero_start:hero_end]
          hero_new = re.sub(r'(<AppButton\b(?=[^>]*title="إضافة طالبة")[^>]*?)tone="outline"', r'\1tone="primary"', hero)
          if hero_new == hero:
              # If the source already has a different tone, force a filled high-contrast button.
              hero_new = re.sub(r'(<AppButton\b(?=[^>]*title="إضافة طالبة")[^>]*?)tone="[^"]+"', r'\1tone="primary"', hero)
          if hero_new == hero and 'title="إضافة طالبة"' not in hero:
              raise SystemExit('Add-student action not found inside hero')
          s = s[:hero_start] + hero_new + s[hero_end:]
          # Make the navigation horizontally scrollable so labels are not squeezed off-screen.
          tab_start = s.find('<View style={styles.tabBar}>')
          if tab_start < 0:
              tab_start = s.find('<View style={[styles.tabBar,')
          if tab_start < 0:
              raise SystemExit('Bottom navigation container not found')
          map_start = s.find('{TABS.map(tab => {', tab_start)
          if map_start < 0:
              raise SystemExit('Navigation tabs map not found')
          if 'style={styles.tabBarScroll}' not in s[tab_start:map_start]:
              s = s[:map_start] + '<ScrollView horizontal showsHorizontalScrollIndicator={false} style={styles.tabBarScroll} contentContainerStyle={styles.tabBarContent}>\n        ' + s[map_start:]
          map_end = s.find('        })}', map_start)
          if map_end < 0:
              raise SystemExit('Navigation tabs map end not found')
          wrapper_end = s.find('</View>', map_end)
          if wrapper_end < 0:
              raise SystemExit('Navigation wrapper end not found')
          if '</ScrollView>' not in s[map_end:wrapper_end]:
              s = s[:wrapper_end] + '</ScrollView>\n      ' + s[wrapper_end:]
          style_pattern = r'  tabBar: \{[^\n]*\}, tabItem: \{[^\n]*\}, tabIcon: \{[^\n]*\}, tabIconSelected: \{[^\n]*\}, tabText: \{[^\n]*\}, tabTextSelected: \{[^\n]*\},'
          new_styles = '  tabBar: { minHeight: 84, paddingHorizontal: 2, paddingTop: 5, backgroundColor: "#FBF6ED", borderTopWidth: 1, borderTopColor: COLORS.border, shadowColor: "#6B6257", shadowOpacity: 0.08, shadowOffset: { width: 0, height: -4 }, shadowRadius: 10, elevation: 8 }, tabBarScroll: { flex: 1 }, tabBarContent: { flexDirection: "row-reverse", alignItems: "center", paddingHorizontal: 3, gap: 2 }, tabItem: { alignItems: "center", justifyContent: "center", width: 68, flexGrow: 0, flexShrink: 0, gap: 3, paddingTop: 1 }, tabIcon: { width: 40, height: 38, borderRadius: 12, alignItems: "center", justifyContent: "center" }, tabIconSelected: { backgroundColor: COLORS.lavender }, tabText: { color: COLORS.muted, fontSize: 9, lineHeight: 12, fontWeight: "700", textAlign: "center", width: 66 }, tabTextSelected: { color: COLORS.primaryDeep, fontWeight: "900" },'
          s2, count = re.subn(style_pattern, new_styles, s, count=1)
          if count == 0 and 'tabBarScroll:' not in s2:
              raise SystemExit('Navigation styles not found')
          s = s2
          p.write_text(s)
          print('Hero action contrast and horizontally scrollable navigation applied')
          PY

      - name: Verify Expo project
        run: |
          test -f package.json
          test -f App.tsx
          test -f eas.json
          test -d android
          node -e "const p=require('./package.json'); console.log('name=',p.name); console.log('version=',p.version);"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: TypeScript diagnostics
        continue-on-error: true
        run: npm run typecheck

      - name: Build Android Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NANELSH-Academy-OS-Final-Visual-3D-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
